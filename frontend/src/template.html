<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' ws://localhost:* http://localhost:*; connect-src 'self' ws://localhost:* http://localhost:*; img-src 'self' data:;">
  <title>ABIX</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #14161C;
      color: #E8E6E1;
      font-family: 'IBM Plex Mono', monospace;
      overflow: hidden;
      user-select: none;
    }
    #root { width: 100vw; height: 100vh; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1D2027; }
    ::-webkit-scrollbar-thumb { background: #FF8A3D44; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #FF8A3D88; }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
