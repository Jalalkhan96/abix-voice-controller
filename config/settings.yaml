agent:
  greeting: "Hi, I'm ABIX — do you need any help?"
  wake_word_phrase: "hi abix"
  listen_duration_seconds: 10
  audio_sample_rate: 16000
  audio_channels: 1

# Language configuration. Swapping locales requires downloading the matching
# STT/TTS models (see scripts/download_models.sh) — this section just wires
# the pipeline so nothing is hardcoded to English once those models exist.
locale:
  # ISO 639-1 code passed to the Whisper STT service. Use "auto" for
  # language auto-detection instead of forcing one.
  stt_language: "en"
  # Prefix used to pick a Piper voice model out of the TTS service's
  # /models directory (e.g. "es_ES" would match "es_ES-*.onnx").
  tts_voice_prefix: "en_US"
  wake_phrases:
  - "hi abix"
  - "hey abix"
  - "hey jarvis"
  - "hey a b i x"
  - "hi a b i x"
  - "abix"

services:
  stt:
    url: "http://localhost:8001"
    model: "base"
  tts:
    url: "http://localhost:8002"
    voice: "en_US-lessac-medium"
  nlu:
    url: "http://localhost:8003"

llm:
  ollama_url: "http://localhost:11434"
  model: "mistral"
  enabled: true
  timeout_seconds: 10

semantic_search:
  persist_dir: "data/chroma"
  embedding_model: "all-MiniLM-L6-v2"
  max_index_files: 500
  search_top_k: 5

safety:
  log_path: "data/audit.db"
  whitelist_path: "config/whitelist.yaml"
  confirmation_timeout_seconds: 15

ui:
  websocket_port: 8765
  caption_history_limit: 50
  history_panel_limit: 100

backend:
  # Origins allowed to call the HTTP API (backend/main.py). The packaged
  # Electron app loads over file:// and talks to the agent's WebSocket
  # server directly, not this API — this only matters for the webpack dev
  # server and any external tooling that calls the HTTP endpoints.
  cors_origins:
  - "http://localhost:9080"

plugins:
  # How often the agent checks the skills/ directory for added, removed, or
  # edited manifest.yaml files and reloads without a restart.
  reload_poll_seconds: 5

hand_tracking:
  enabled: false
  camera_index: 0
  cursor_smoothing: 0.7
  click_threshold: 0.03
  scroll_threshold: 0.05
