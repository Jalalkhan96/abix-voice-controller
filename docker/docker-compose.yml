version: "3.9"

services:
  stt-service:
    build: ./stt-service
    ports:
      - "8001:8001"
    volumes:
      - ../models/whisper:/models
    # Uncomment for NVIDIA GPU acceleration:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  tts-service:
    build: ./tts-service
    ports:
      - "8002:8002"
    volumes:
      - ../models/tts:/models

  nlu-service:
    build:
      context: ..
      dockerfile: docker/nlu-service/Dockerfile
    ports:
      - "8003:8003"

networks:
  default:
    name: abix-network
